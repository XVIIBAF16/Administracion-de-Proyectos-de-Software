{% extends "tareas/base.html" %}
{% block contenido %}
    <h3>¿Borrar la tarea "{{ tarea.titulo }}"?</h3>
    <p class="text-muted">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, borrar</button>
        <a href="{% url 'lista_tareas' %}" class="btn btn-link">Cancelar</a>
    </form>
{% endblock %}
